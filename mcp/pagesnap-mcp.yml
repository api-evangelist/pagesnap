instructions: Pagesnap turns public URLs into clean Markdown, screenshots, PDFs, metadata, structured
  data, or crawls. Every content tool advertises an optional keyless x402 HTTP equivalent in namespaced
  _meta; those routes use exact USDC payments on Base and do not change the MCP session's plan.
tools_file: mcp/pagesnap-mcp-tools.json
tool_count: 11
tools:
- name: read_url
  title: Read URL as Markdown
  key_required: false
  inputs:
  - url
  - format
  - render
  - lang
  - max_chars
  - page_markers
  x402_endpoint: https://pagesnap.142-93-197-141.sslip.io/x402/v1/read
  x402_price_usdc: '0.002'
  description: 'Fetch a public web page and return extracted main content as Markdown (or plain text /
    JSON with title, author, links, and images). It can handle JavaScript-rendered pages (set render=true
    to force a headless browser), PDFs, and plain text; extraction can omit content on unusual layouts.
    Example: read_url({ url: "https://example.com", format: "markdown" }). Keyless per-call HTTP alternative:
    https…'
- name: crawl_site
  title: Crawl a site as Markdown
  key_required: false
  inputs:
  - url
  - limit
  - max_depth
  - same_origin
  - include
  - exclude
  - use_sitemap
  - max_chars
  x402_endpoint: https://pagesnap.142-93-197-141.sslip.io/x402/v1/crawl
  x402_price_usdc: 0.002 per page, maximum 25 pages
  description: 'Crawl up to 25 robots-aware, same-origin pages and concatenate clean Markdown with a source
    header for each page. Useful for RAG ingestion and documentation discovery. Example: crawl_site({
    url: "https://example.com/docs", limit: 5, max_depth: 2 }).'
- name: generate_llms_txt
  title: Generate llms.txt files
  key_required: false
  inputs:
  - url
  - limit
  - include
  - exclude
  - max_chars
  description: 'Crawl a public documentation site with robots.txt and sitemap rules, then generate both
    the concise llms.txt navigation file and a concatenated llms-full.txt Markdown corpus. Example: generate_llms_txt({
    url: "https://example.com/docs", limit: 10 }).'
- name: screenshot_url
  title: Screenshot a URL
  key_required: false
  inputs:
  - url
  - width
  - height
  - full_page
  - dark
  - device
  - wait
  - selector
  - format
  - actions
  - lang
  x402_endpoint: https://pagesnap.142-93-197-141.sslip.io/x402/v1/screenshot
  x402_price_usdc: '0.005'
  description: 'Render a web page in a headless browser and return a screenshot image (plus a temporary
    URL to the file, valid 1 hour). Use it to visually verify pages, capture charts, or show a human what
    a page looks like. Example: screenshot_url({ url: "https://example.com", width: 1280, height: 800,
    format: "png" }).'
- name: pdf_url
  title: Convert URL to PDF
  key_required: false
  inputs:
  - url
  - format
  - landscape
  - lang
  - header
  - footer
  - page_numbers
  x402_endpoint: https://pagesnap.142-93-197-141.sslip.io/x402/v1/pdf
  x402_price_usdc: '0.005'
  description: 'Render a web page to a PDF file and return a temporary download link (valid 1 hour). Example:
    pdf_url({ url: "https://example.com", format: "A4", page_numbers: true }).'
- name: get_meta
  title: Get link preview metadata
  key_required: false
  inputs:
  - url
  - lang
  x402_endpoint: https://pagesnap.142-93-197-141.sslip.io/x402/v1/meta
  x402_price_usdc: '0.002'
  description: 'Return title, description, Open Graph image, favicon, site name, canonical URL, author
    and published time for a public URL without rendering the full page. Example: get_meta({ url: "https://example.com/article"
    }).'
- name: extract_structured
  title: Extract structured web data
  key_required: false
  inputs:
  - url
  - max_chars
  x402_endpoint: https://pagesnap.142-93-197-141.sslip.io/x402/v1/extract
  x402_price_usdc: '0.002'
  description: 'Deterministically extract JSON-LD, microdata, RDFa-lite, Open Graph, Twitter cards, and
    normalized schema entities from a URL. Uses a browser only when bot protection blocks the fetch path.
    Example: extract_structured({ url: "https://example.com/product", max_chars: 30000 }).'
- name: create_monitor
  title: Create a change monitor
  key_required: true
  inputs:
  - url
  - mode
  - interval
  - selector
  - threshold_percent
  - webhook_url
  - width
  - height
  - full_page
  - dark
  - device
  - wait
  note: Returns the monitor webhook_secret exactly once.
  description: 'Create a persisted text, visual, or metadata monitor. A Pagesnap API key is required.
    The webhook signing secret is returned only by this call. Example: create_monitor({ url: "https://example.com",
    mode: "text", interval: "24h" }).'
- name: list_monitors
  title: List change monitors
  key_required: true
  inputs: []
  note: Intentionally omits webhook_secret.
  description: 'List the change monitors owned by the authenticated Pagesnap API key. Example: list_monitors({}).'
- name: usage
  title: Pagesnap usage and limits
  key_required: false
  inputs: []
  description: 'Show the current plan, trial status, remaining quota, and paid or link-based ways to keep
    Pro. Example: usage({}).'
- name: upgrade_plan
  title: Upgrade the Pagesnap plan
  key_required: true
  inputs:
  - plan
  description: 'Create a crypto payment invoice for this API key and return wallet-ready payment options.
    Calling this tool creates a new order; pay exactly one option. Example: upgrade_plan({ plan: "pro"
    }).'
