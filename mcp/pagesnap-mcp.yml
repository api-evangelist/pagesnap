deployment:
  mode: both
  endpoint: https://pagesnap.142-93-197-141.sslip.io/mcp
  install: npx -y github:CalibratedGhosts/PageSnap mcp
  package: https://github.com/CalibratedGhosts/PageSnap
  auth: none
