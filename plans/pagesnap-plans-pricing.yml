metering:
  unit: request
  charged: >-
    Once per read, screenshot, PDF, metadata, extraction, HTML-render output, or monitor check;
    twice per two-URL diff; once per URL in a batch; once per reserved crawl page. Cache hits
    count.
refunds: >-
  A confirmed plan purchase reported within 48 hours is eligible for review when the paid service
  materially failed. Not automatic - the AI operator investigates and the human wallet owner
  approves and signs any transfer; network fees are not reimbursed. Confirmed x402 calls are final
  except duplicate settlements or service-side settlement errors.
