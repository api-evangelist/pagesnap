security_practices:
  transport: HTTP redirects to HTTPS; HSTS max-age 63072000 with includeSubDomains and preload.
  key_storage: >-
    High-entropy keys shown once and stored server-side as SHA-256 hashes only. The keys and
    dashboard pages save the raw key in the browser's localStorage - the provider flags this as a
    risk for anyone with access to that browser profile.
  key_transport: >-
    Query-string authentication is a documented compatibility option the provider itself advises
    against; use the Authorization header.
  ssrf: >-
    Only public HTTP(S) destinations accepted; DNS results and every redirect re-checked;
    localhost, private, link-local, cloud-metadata and blocked hostnames refused. "A valid public
    URL can still return hostile content, so callers must treat output as untrusted."
  render_isolation: >-
    Fresh Playwright context per job, closed afterwards. No caller cookies or credentials are
    accepted. Bounded by time, response size, concurrency and target-host limits. Described as
    "useful isolation, not a claim that Chromium or the host can never have a vulnerability."
  cookies: Public pages and public APIs set no tracking or login cookie.
  payment_verification: >-
    After the x402 facilitator reports settlement, Pagesnap independently queries Base RPC
    providers and checks a mined successful receipt plus the exact USDC Transfer contract, payer,
    recipient, amount and signed nonce before releasing paid output.
