apis:
- name: Pagesnap API
  description: >-
    REST API converting public URLs to Markdown, text, HTML, JSON, ARIA trees, screenshots, PDFs, link-preview
    metadata and normalized structured data, plus batch reads, robots-aware crawls with a 202 job handshake,
    llms.txt generation, visual and text diffs, persisted change monitors with HMAC-signed webhooks, accountless
    support tickets, crypto checkout with durable receipts, and public status/stats JSON. 66 operations
    across 58 paths in a generated OpenAPI 3.1 document. Global security is optional: every content operation
    is callable with no credential at a lower quota, a ps_live_ bearer key raises it, and seven mirrored
    /x402/v1/* routes take keyless per-call USDC on Base instead of plan quota.
