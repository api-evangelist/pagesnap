note: >-
  Pagesnap's market - web-page conversion for agents - has no domain standard body in the sense of
  FHIR or ISO 20022. What it does have is the emerging agent-interop stack, and Pagesnap declares
  and serves an unusual amount of it: MCP, A2A 1.0, x402 v2, ARD, RFC 9727, RFC 9116, llms.txt.
  Every `conforms: true` below is backed by a document this pass fetched, not by a marketing claim.
