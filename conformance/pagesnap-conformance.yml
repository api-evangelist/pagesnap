domain_standard:
  applicable: false
  reason: >-
    Web-page-to-Markdown conversion has no sector standards body. The nearest applicable regime is
    the agent-interop stack (MCP / A2A / x402 / ARD), recorded above rather than invented as a
    domain conformance.
certifications: []
certifications_note: >-
  None, and the provider says so directly: "Pagesnap is a small experimental service, not a
  compliance-certified platform." No SOC 2, ISO 27001, PCI, HIPAA or FedRAMP is claimed. No
  Compliance pointer is emitted, because there is no compliance program to point at.
robots_compliance:
  honors_robots_txt: true
  detail: >-
    Crawl and llms-txt generation are documented as robots-aware with a per-host delay. Pagesnap
    never solves CAPTCHA or Turnstile and refuses private, localhost, link-local and
    cloud-metadata destinations.
