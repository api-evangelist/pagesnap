  - target: $.info
    update:
      x-gaps:
        - id: no-idempotency-key
          detail: >-
            No Idempotency-Key header on any write operation (createKey, createMonitor,
            createCheckout, verifyLinkGrant, createSupportTicket). x402 replay protection covers
            only the paid path.
        - id: no-rfc9457
          detail: >-
            Errors are a custom {"error":{code,message,reason}} envelope with a closed 58-value
            enum rather than application/problem+json.
        - id: no-request-id
          detail: No correlation-id request or response header is documented or observed.
        - id: no-webhook-payload-schema
          detail: >-
            The monitor webhook's signing, delivery and disable semantics are fully documented but
            the notification body schema is not published, and webhooks[] in the spec is empty.
        - id: no-crawl-job-callback
          detail: >-
            Asynchronous crawl and llms-txt jobs are poll-only; a completion webhook would remove
            the only mandatory polling loop in the API.
        - id: unregistered-package-names
          detail: >-
            The CLI/MCP bridge installs from GitHub, while `pagesnap` on npm and PyPI belong to
            unrelated authors - a name-confusion risk for anyone who guesses the install command.
        - id: ip-based-hostname
          detail: >-
            The service runs on a free sslip.io wildcard-DNS hostname derived from its IP, so
            every published URL breaks if the VPS address changes, and the registrable domain is
            not under provider control.
