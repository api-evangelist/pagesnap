sla:
  exists: false
  statement: >-
    "The single-VPS service has no SLA." Production runs on one VPS in New York City with no
    multi-region failover. Measured history is public at /status and /v1/status instead of a
    contractual commitment.
retention:
  request_logs: 30 days, capped at 500,000 rows
  page_cache: 10 minutes (read/meta/extract); 5 minutes (screenshot/PDF)
  temporary_result_links: 1 hour, housekeeping removes remnants after roughly 2 hours
  crawl_job_results: 24 hours, capped at 32 MiB
  monitor_history: latest 100 checks, 10 changed snapshots and 10 diffs per monitor; snapshots capped at 500 KB
  a2a_tasks: process-local, expire after 10 minutes
  abuse_records: key-to-IP 30 days; checkout attempts 35 days
  visit_and_service_history: up to 400 days
  account_and_payment_records: retained while the service operates
  raw_api_keys: never stored (SHA-256 hash only)
