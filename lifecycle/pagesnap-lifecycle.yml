versioning:
  scheme: url-prefix
  current: /v1
  contract_version: 1.1.0
  promise: >-
    No silent breaking changes in v1. Removing or renaming endpoints, required inputs, response
    fields, or established meanings requires a new version prefix. Additive changes (new optional
    request capabilities, response fields, enum values, headers) are allowed and clients must
    tolerate them.
  scope: >-
    Covers both GET and POST forms of read/screenshot/PDF, extraction, render, batch, crawl and
    job polling, diff, monitor lifecycle routes, keys/usage, checkout status, and support JSON.
    Binary media types and documented JSON fields are part of the contract. Shortcut, discovery,
    badge, receipt, status, MCP, A2A and x402 URLs remain supported while also following their own
    protocol version negotiation.
