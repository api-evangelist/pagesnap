openapi: 3.2.0
info:
  title: Pagesnap X402 API
  version: 1.1.0
  description: Turn public HTTP(S) URLs into Markdown, structured data, images, PDFs, crawls, diffs, and monitors. Anonymous, API-key, agent-protocol, and x402 payment surfaces are described from the same runtime contract.
  contact:
    url: https://pagesnap.142-93-197-141.sslip.io/support
  license:
    name: Service terms
    url: https://pagesnap.142-93-197-141.sslip.io/terms
  x-guidance: For keyless USDC requests, call an /x402/v1 route once without payment, decode PAYMENT-REQUIRED, then retry the same request with PAYMENT-SIGNATURE.
servers:
- url: https://pagesnap.142-93-197-141.sslip.io
security:
- {}
- bearer: []
- apiHeader: []
- apiQuery: []
tags:
- name: X402
  description: Keyless USDC per-call payment
paths:
  /x402/v1/read:
    get:
      operationId: readUrlX402
      summary: Read a URL paid per call
      tags:
      - X402
      security:
      - x402: []
      parameters:
      - name: url
        in: query
        required: true
        schema:
          type: string
          format: uri
          pattern: ^https?://
          maxLength: 4096
        description: Public HTTP(S) URL; a missing scheme is accepted by the core /v1 URL endpoints and interpreted as HTTPS.
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - markdown
          - md
          - text
          - html
          - json
          - aria
          - links
          default: markdown
        description: Output representation. md aliases markdown; aria forces browser rendering.
      - name: render
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Force browser rendering.
      - name: timeout
        in: query
        required: false
        schema:
          type: integer
          minimum: 3000
          maximum: 45000
          default: 20000
        description: Overall timeout.
      - name: wait
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
        description: Extra post-load wait.
      - name: links
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: Include links in JSON output.
      - name: images
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: Include images in JSON output.
      - name: full
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Extract the full body rather than main content.
      - name: max_chars
        in: query
        required: false
        schema:
          type: integer
          minimum: 100
          maximum: 2000000
        description: Truncate Markdown at this character count and return a marker.
      - name: page_markers
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: For PDFs, add optional <!-- page N --> markers.
      - name: actions
        in: query
        required: false
        schema:
          type: string
          contentMediaType: application/json
        description: JSON-encoded array of at most 10 pre-capture actions. Prefer a POST JSON body.
      - name: lang
        in: query
        required: false
        schema:
          type: string
          maxLength: 35
          default: en-US
          examples:
          - en-US
          - ja-JP
        description: Safe BCP-47 language tag.
      - name: timezone
        in: query
        required: false
        schema:
          type: string
          default: UTC
          examples:
          - UTC
          - America/New_York
        description: UTC or an IANA time zone supported by the runtime.
      x-pagesnap-quota:
        units: 0
        paidSeparately: true
      responses:
        '200':
          description: Extracted page content.
          content:
            text/markdown:
              schema:
                type: string
            text/plain:
              schema:
                type: string
            text/html:
              schema:
                type: string
            text/yaml:
              schema:
                type: string
                description: ARIA accessibility snapshot.
            application/json:
              schema:
                $ref: '#/components/schemas/ReadResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: x402 v2 exact payment required, invalid, or replayed. Decode PAYMENT-REQUIRED, sign the selected Base USDC requirement, and retry the request unchanged with PAYMENT-SIGNATURE.
          headers:
            PAYMENT-REQUIRED:
              required: true
              schema:
                type: string
              description: Base64-encoded x402 payment requirements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '408':
          $ref: '#/components/responses/Timeout'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-payment-info:
        protocol: x402
        version: 2
        scheme: exact
        network: eip155:8453
        asset: USDC
        price:
          mode: fixed
          currency: USD
          amount: '0.002'
  /x402/v1/screenshot:
    get:
      operationId: screenshotUrlX402
      summary: Capture a URL paid per call
      tags:
      - X402
      security:
      - x402: []
      parameters:
      - name: url
        in: query
        required: true
        schema:
          type: string
          format: uri
          pattern: ^https?://
          maxLength: 4096
        description: Public HTTP(S) URL; a missing scheme is accepted by the core /v1 URL endpoints and interpreted as HTTPS.
      - name: width
        in: query
        required: false
        schema:
          type: integer
          minimum: 200
          maximum: 3840
          default: 1280
        description: Viewport width in CSS pixels.
      - name: height
        in: query
        required: false
        schema:
          type: integer
          minimum: 200
          maximum: 10000
          default: 800
        description: Viewport height.
      - name: full_page
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Capture the full scrollable page.
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - png
          - jpeg
          - jpg
          - webp
          default: png
        description: Image format; jpg aliases jpeg.
      - name: quality
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 80
        description: JPEG/WebP quality.
      - name: scale
        in: query
        required: false
        schema:
          type: number
          minimum: 1
          maximum: 3
          default: 1
        description: Device scale factor.
      - name: dark
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Emulate dark color scheme.
      - name: wait
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
        description: Extra post-load wait in milliseconds.
      - name: wait_until
        in: query
        required: false
        schema:
          type: string
          enum:
          - load
          - domcontentloaded
          - networkidle
        description: Navigation completion event.
      - name: block_ads
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: Block known ad/tracker requests.
      - name: hide_cookie_banners
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: Hide common cookie banners.
      - name: timeout
        in: query
        required: false
        schema:
          type: integer
          minimum: 3000
          maximum: 45000
          default: 25000
        description: Overall timeout in milliseconds.
      - name: selector
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
        description: CSS selector to clip.
      - name: device
        in: query
        required: false
        schema:
          type: string
          maxLength: 40
        description: Playwright device name.
      - name: user_agent
        in: query
        required: false
        schema:
          type: string
          maxLength: 300
        description: Custom user agent.
      - name: actions
        in: query
        required: false
        schema:
          type: string
          contentMediaType: application/json
        description: JSON-encoded array of at most 10 pre-capture actions. Prefer a POST JSON body.
      - name: lang
        in: query
        required: false
        schema:
          type: string
          maxLength: 35
          default: en-US
          examples:
          - en-US
          - ja-JP
        description: Safe BCP-47 language tag.
      - name: timezone
        in: query
        required: false
        schema:
          type: string
          default: UTC
          examples:
          - UTC
          - America/New_York
        description: UTC or an IANA time zone supported by the runtime.
      x-pagesnap-quota:
        units: 0
        paidSeparately: true
      responses:
        '200':
          description: Screenshot bytes.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: x402 v2 exact payment required, invalid, or replayed. Decode PAYMENT-REQUIRED, sign the selected Base USDC requirement, and retry the request unchanged with PAYMENT-SIGNATURE.
          headers:
            PAYMENT-REQUIRED:
              required: true
              schema:
                type: string
              description: Base64-encoded x402 payment requirements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '408':
          $ref: '#/components/responses/Timeout'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-payment-info:
        protocol: x402
        version: 2
        scheme: exact
        network: eip155:8453
        asset: USDC
        price:
          mode: fixed
          currency: USD
          amount: '0.005'
  /x402/v1/pdf:
    get:
      operationId: pdfUrlX402
      summary: Render a PDF paid per call
      tags:
      - X402
      security:
      - x402: []
      parameters:
      - name: url
        in: query
        required: true
        schema:
          type: string
          format: uri
          pattern: ^https?://
          maxLength: 4096
        description: Public HTTP(S) URL; a missing scheme is accepted by the core /v1 URL endpoints and interpreted as HTTPS.
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - A4
          - A3
          - A5
          - Letter
          - Legal
          - Tabloid
          default: A4
        description: Paper size.
      - name: landscape
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Landscape orientation.
      - name: margin
        in: query
        required: false
        schema:
          type: string
          maxLength: 30
          default: 10mm
        description: One CSS length used on all sides.
      - name: print_background
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: Print backgrounds.
      - name: scale
        in: query
        required: false
        schema:
          type: number
          minimum: 0.1
          maximum: 2
          default: 1
        description: Print scale.
      - name: page_ranges
        in: query
        required: false
        schema:
          type: string
          maxLength: 50
        description: Chromium page-range expression, for example 1-3,5.
      - name: device
        in: query
        required: false
        schema:
          type: string
          maxLength: 40
        description: Playwright device name.
      - name: header
        in: query
        required: false
        schema:
          type: string
          maxLength: 2048
        description: Sanitized header template.
      - name: footer
        in: query
        required: false
        schema:
          type: string
          maxLength: 2048
        description: Sanitized footer template.
      - name: page_numbers
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Add Page X of Y; cannot be combined with footer.
      - name: wait
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
        description: Extra post-load wait.
      - name: timeout
        in: query
        required: false
        schema:
          type: integer
          minimum: 3000
          maximum: 45000
          default: 30000
        description: Overall timeout.
      - name: actions
        in: query
        required: false
        schema:
          type: string
          contentMediaType: application/json
        description: JSON-encoded array of at most 10 pre-capture actions. Prefer a POST JSON body.
      - name: lang
        in: query
        required: false
        schema:
          type: string
          maxLength: 35
          default: en-US
          examples:
          - en-US
          - ja-JP
        description: Safe BCP-47 language tag.
      - name: timezone
        in: query
        required: false
        schema:
          type: string
          default: UTC
          examples:
          - UTC
          - America/New_York
        description: UTC or an IANA time zone supported by the runtime.
      x-pagesnap-quota:
        units: 0
        paidSeparately: true
      responses:
        '200':
          description: PDF bytes.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: x402 v2 exact payment required, invalid, or replayed. Decode PAYMENT-REQUIRED, sign the selected Base USDC requirement, and retry the request unchanged with PAYMENT-SIGNATURE.
          headers:
            PAYMENT-REQUIRED:
              required: true
              schema:
                type: string
              description: Base64-encoded x402 payment requirements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '408':
          $ref: '#/components/responses/Timeout'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-payment-info:
        protocol: x402
        version: 2
        scheme: exact
        network: eip155:8453
        asset: USDC
        price:
          mode: fixed
          currency: USD
          amount: '0.005'
  /x402/v1/meta:
    get:
      operationId: getMetaX402
      summary: Get metadata paid per call
      tags:
      - X402
      security:
      - x402: []
      parameters:
      - name: url
        in: query
        required: true
        schema:
          type: string
          format: uri
          pattern: ^https?://
          maxLength: 4096
        description: Public HTTP(S) URL; a missing scheme is accepted by the core /v1 URL endpoints and interpreted as HTTPS.
      x-pagesnap-quota:
        units: 0
        paidSeparately: true
      responses:
        '200':
          description: Metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: x402 v2 exact payment required, invalid, or replayed. Decode PAYMENT-REQUIRED, sign the selected Base USDC requirement, and retry the request unchanged with PAYMENT-SIGNATURE.
          headers:
            PAYMENT-REQUIRED:
              required: true
              schema:
                type: string
              description: Base64-encoded x402 payment requirements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '408':
          $ref: '#/components/responses/Timeout'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-payment-info:
        protocol: x402
        version: 2
        scheme: exact
        network: eip155:8453
        asset: USDC
        price:
          mode: fixed
          currency: USD
          amount: '0.002'
  /x402/v1/extract:
    get:
      operationId: extractStructuredX402
      summary: Extract structured data paid per call
      tags:
      - X402
      security:
      - x402: []
      parameters:
      - name: url
        in: query
        required: true
        schema:
          type: string
          format: uri
          pattern: ^https?://
          maxLength: 4096
        description: Public HTTP(S) URL; a missing scheme is accepted by the core /v1 URL endpoints and interpreted as HTTPS.
      - name: timeout
        in: query
        required: false
        schema:
          type: integer
          minimum: 3000
          maximum: 45000
          default: 20000
        description: Overall timeout.
      x-pagesnap-quota:
        units: 0
        paidSeparately: true
      responses:
        '200':
          description: Structured extraction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: x402 v2 exact payment required, invalid, or replayed. Decode PAYMENT-REQUIRED, sign the selected Base USDC requirement, and retry the request unchanged with PAYMENT-SIGNATURE.
          headers:
            PAYMENT-REQUIRED:
              required: true
              schema:
                type: string
              description: Base64-encoded x402 payment requirements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
