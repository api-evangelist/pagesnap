summary: >-
  Pagesnap ships first-party clients but publishes NONE of them to a package registry. The
  Python/JavaScript/Bash clients are single files downloaded from the provider's own /sdk path,
  and the CLI + MCP stdio bridge is installed directly from GitHub. Every registry field below is
  therefore either read from the repository manifest or recorded as null with the reason.
registry_squat_warning: >-
  The names `pagesnap` on npm and `pagesnap` on PyPI are BOTH taken by unrelated third parties
  (npm: ppetkov89, a vanilla-JS full-page scrolling library, 1.0.2 published 2025-04-25; PyPI:
  maxiee, a Playwright single-file page saver, 0.0.2). Neither is this company. `npm i pagesnap`
  or `pip install pagesnap` installs somebody else's project. Verified 2026-09-02 against
  registry.npmjs.org and pypi.org.
