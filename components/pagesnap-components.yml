families:
  - name: Embeddable link previews
    kind: browser-widget
    loader: '<script src="https://pagesnap.142-93-197-141.sslip.io/embed/preview.js"></script>'
    docs: https://pagesnap.142-93-197-141.sslip.io/embed
    dependencies: none
    description: >-
      Dependency-free script that attaches rich previews to external links on hover, keyboard
      focus, or first touch. Metadata is fetched only when a preview is actually requested.
    configuration:
      - attribute: data-selector
        default: a[href^="http"]
        purpose: CSS selector for previewable links; the default excludes same-origin destinations.
      - attribute: data-delay
        default: '250'
        purpose: Hover or keyboard-focus delay in milliseconds.
      - attribute: data-theme
        default: auto
        purpose: light, dark, or auto from the visitor's color preference.
      - attribute: data-mode
        default: meta
        purpose: meta for a rich card, screenshot for a small page image.
      - attribute: data-key
        default: none
        purpose: Optional Pagesnap API key sent as bearer authentication.
      - attribute: init
        default: automatic
        purpose: init="manual" skips auto-setup; call window.Pagesnap.preview(options) yourself.
    guarantees: >-
      No cookies or persistent storage; in-browser cap of one request start per second and 40 per
      page load. CSP guidance is published on the same page.
