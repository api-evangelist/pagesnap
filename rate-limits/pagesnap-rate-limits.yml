response_headers:
  - name: X-Plan
    meaning: The plan the request was metered against (anon, free, starter, pro, scale).
  - name: X-RateLimit-Limit
    meaning: Ceiling for the scope named by X-RateLimit-Scope.
  - name: X-RateLimit-Remaining
    meaning: Requests left in that window.
  - name: X-RateLimit-Scope
    meaning: Which window the limit/remaining pair describes (e.g. day).
  - name: Retry-After
    meaning: Set on 429 and on 503 BUSY when a useful wait can be computed.
  - name: ETag
    meaning: Returned on cacheable content responses; 304 is supported.
exhaustion:
  status_codes:
    - code: 429
      codes: [RATE_LIMITED, TARGET_BUSY, ANON_GLOBAL_QUOTA, DAILY_QUOTA, MONTHLY_QUOTA, CONCURRENCY, KEY_LIMIT, KEY_SPIKE_LIMIT]
      meaning: Caller limit, per-target protection, or plan quota exhausted.
    - code: 503
      codes: [BUSY, ENGINE_UNAVAILABLE, JOB_QUEUE_FULL]
      meaning: >-
        Plan-prioritized admission wait expired, or sustained CPU load shed new anonymous browser
        work. Distinct from 429 on purpose - it is capacity protection, not a caller limit.
  guidance: Respect Retry-After and back off exponentially. Nothing is charged automatically on 429.
